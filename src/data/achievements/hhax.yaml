---
- id: hhax-01
  text_tex: Engineered unified and analytics Snowflake/dbt models spanning 55 tables
    across two organizations and two source-system configurations, establishing reusable
    patterns for faster client onboarding.
  story_tex: >-
    \textbf{Situation:} After HHAeXchange and Sandata came together, the reporting layer
    had two versions of the same healthcare world. Patients, caregivers, offices, and
    visits existed in both systems, but their keys, types, and lifecycle rules disagreed.
    Maintaining parallel analytics would have doubled support effort and made every new
    report a reconciliation exercise. \textbf{Task:} I needed to create one dependable
    analytical contract while keeping the existing HHA reporting path stable.
    \textbf{Action:} I first mapped where the systems agreed and where they genuinely
    differed. I preserved source identifiers for traceability, introduced stable warehouse
    identities, normalized types and lifecycle behavior, and isolated source-specific logic
    before bringing both paths into common models. I validated each domain with paired
    examples so downstream teams could see that ``unified'' did not mean erasing meaningful
    differences. \textbf{Result:} Analysts could work from one coherent model instead of
    learning two platforms, and the team gained a reusable integration pattern rather than
    a merger-specific patchwork.
- id: hhax-02
  text_tex: Implemented reusable SQL/Jinja transformation logic for lifecycle states,
    null handling, sentinel dates, and source-system variations across organization,
    office, caregiver, and patient domains.
  story_tex: >-
    \textbf{Situation:} The most dangerous differences between the HHA and Sandata feeds
    were not dramatic schema changes; they were small semantic disagreements. A blank
    value could mean ``unknown'' in one feed and ``not applicable'' in another, while an
    inactive or deleted record could remain apparently current if interpreted literally.
    \textbf{Task:} I needed to make those differences predictable before they reached
    shared patient, caregiver, office, and organization models. \textbf{Action:} I turned
    recurring edge cases into reusable SQL/Jinja rules for types, nulls, dates, lifecycle
    states, and deterministic record selection. I kept source labels and application IDs
    visible, so anyone investigating an exception could follow it back to the originating
    system rather than treating the shared model as a black box. \textbf{Result:} New
    domains inherited consistent behavior, reviewers could explain why a record was active
    or excluded, and source variation stopped leaking into every downstream model.
- id: hhax-03
  text_tex: Created or materially redesigned 30 automated SQL/dbt data-quality tests
    covering nulls, duplicates, referential integrity, business rules, lifecycle logic,
    and source-to-target reconciliation.
  story_tex: >-
    \textbf{Situation:} New EVV models were progressing through environments, but review
    still depended too heavily on spot checks. A model could compile successfully while
    quietly duplicating patients, breaking parent-child relationships, or mishandling a
    deletion state. \textbf{Task:} I needed to turn those hidden risks into failures that
    appeared early and explained themselves. \textbf{Action:} I built a layered dbt test
    suite covering structural expectations, business rules, relationships, lifecycle
    behavior, and source-to-target reconciliation. When built-in tests could not handle
    quoted identifiers or source-specific rules, I created reusable generic tests. I also
    reran the exact failing cohort after each fix so a green result represented regression
    evidence, not a fresh sample. \textbf{Result:} Quality review became a repeatable gate
    rather than a judgment call, defects reached engineers with a clear failure mode, and
    releases could proceed with evidence instead of optimism.
- id: hhax-04
  text_tex: Translated ambiguous business requirements into documented mappings, acceptance
    criteria, onboarding standards, and 12 data-quality investigation runbooks.
  story_tex: >-
    \textbf{Situation:} Requirements often arrived as a simple request to make Sandata
    data ``work like HHA.'' That phrase concealed important choices about grain, joins,
    lifecycle states, and how much variance was acceptable. Different reviewers could
    approve different behavior while believing they agreed. \textbf{Task:} I needed to
    turn an ambiguous comparison into a shared definition of done. \textbf{Action:} I
    translated each business expectation into a mapping, an acceptance criterion, and an
    executable investigation path. The resulting runbooks led an engineer from symptom to
    evidence: what to query, what relationship to expect, how to classify severity, and
    what had to be retested before sign-off. I used real failure examples so the documents
    reflected how investigations actually unfolded. \textbf{Result:} Reviews became faster
    and less subjective, disagreements surfaced while they were still design questions,
    and new team members had a practical playbook for diagnosing future data problems.
- id: hhax-05
  text_tex: Conducted feasibility analysis of source-system structures and implementation
    constraints to shape integration scope, modeling strategy, and delivery approach.
  story_tex: >-
    \textbf{Situation:} The team was under pressure to commit to a unified EVV design
    before anyone had proven that the Sandata snapshots contained the history and
    relationships the existing analytics required. The risk was promising parity and
    discovering late that the source could not support it. \textbf{Task:} I needed to
    separate what was genuinely feasible from what required a changed scope or an explicit
    limitation. \textbf{Action:} I treated the source like an investigation rather than a
    specification. I profiled raw behavior, followed candidate joins, challenged assumed
    grains, and tested how updates and deletions appeared over time. I brought the gaps back
    as concrete examples and used them to shape staging boundaries, identity rules, and
    acceptance criteria before the full build began. \textbf{Result:} Stakeholders made
    scope decisions with evidence, engineering avoided designing around false assumptions,
    and known source limitations became planned constraints instead of late surprises.
- id: hhax-06
  text_tex: Structured target models using FHIR-like concepts where appropriate to
    improve consistency and extensibility for downstream integration and analytics.
  story_tex: >-
    \textbf{Situation:} In the merged environment, the same healthcare concept appeared
    under different names and table structures. Downstream users had to understand each
    source before they could answer a basic question about a patient, caregiver, location,
    or address. \textbf{Task:} I needed a target model that felt familiar across systems
    and could evolve without falsely claiming full FHIR conformance. \textbf{Action:} I
    borrowed FHIR-like resource boundaries where they clarified the data, separated core
    entities from relationships and supporting attributes, and preserved provenance at
    every boundary. I repeatedly checked the conceptual design against actual report fields
    and join paths, rejecting abstractions that made the real workflow harder to express.
    \textbf{Result:} The warehouse acquired a more intuitive vocabulary, mappings became
    easier to review, and future integrations had recognizable extension points instead of
    another source-shaped schema.
- id: hhax-07
  text_tex: Defined surrogate-key, natural-key, and crosswalk strategies supporting
    stable identity resolution across related source systems.
  story_tex: >-
    \textbf{Situation:} Both source systems reused local identifiers. Two unrelated
    patients or offices could share the same numeric ID simply because they belonged to
    different accounts, which meant a naive join could create a believable but incorrect
    relationship. \textbf{Task:} I needed identities that were stable across the warehouse
    without severing the path back to the source record. \textbf{Action:} I defined the
    true business grain for each entity, built composite natural keys with the account and
    domain context needed to make them meaningful, and mapped those keys to stable warehouse
    identifiers. I carried the same rules through facts, dimensions, and crosswalks, then
    deliberately searched for collisions and broken references. \textbf{Result:} Shared
    models stopped confusing locally reused IDs, relationships remained traceable to their
    origin, and later identity corrections could be made in one governed place.
- id: hhax-08
  text_tex: Resolved data-quality and mapping issues through targeted test-case analysis
    and review of failing source and target records.
  story_tex: >-
    \textbf{Situation:} Integration defects rarely announced where they began. A missing
    dashboard record might originate in a raw source value, a staging cast, a deduplication
    rule, or a join several layers upstream. Broad fixes risked disturbing data that was
    already correct. \textbf{Task:} I needed to find the first point where a known-good
    record changed or disappeared and correct only that behavior. \textbf{Action:} I built
    small cohorts around representative failures and followed the same identifiers from
    raw ingestion through staging, core, and BI. I removed joins one at a time, compared
    null and population changes, and used the earliest divergence to identify the faulty
    rule. After making a focused correction, I replayed the original case as a regression
    test. \textbf{Result:} Investigations became explainable rather than speculative,
    fixes stayed narrowly scoped, and reviewers could see both the defect and the evidence
    that it was gone.
- id: hhax-09
  text_tex: Collaborated with client and internal stakeholders to resolve source ambiguity,
    refine requirements, and translate business needs into production-ready data assets.
  story_tex: >-
    \textbf{Situation:} Some of the most important EVV rules could not be discovered from
    column names. The data alone could not tell us which patient address was authoritative,
    what a usage tag meant, or which lifecycle event downstream reporting considered final.
    Guessing would have produced clean-looking but incorrect models. \textbf{Task:} I needed
    to get the right business decision without asking stakeholders to reason from abstract
    schemas. \textbf{Action:} I brought concrete patient and visit examples, showed how
    each possible interpretation changed the output, and framed the decision in operational
    terms. Once stakeholders chose the intended behavior, I captured it in mappings,
    acceptance criteria, and QA evidence, incorporated peer feedback, and demonstrated the
    result in Snowflake before promotion. \textbf{Result:} Ambiguity became an explicit,
    testable rule, stakeholders understood the consequence of the choice, and production
    logic had a documented business rationale.
- id: hhax-10
  text_tex: Established reusable patterns for onboarding additional sources and extending
    integration workflows.
  story_tex: >-
    \textbf{Situation:} The merger was only the immediate integration challenge. If the
    solution depended on hard-coded exceptions, the next acquired or partner source would
    force the team to solve the same architectural problem again. \textbf{Task:} I needed
    to leave behind an onboarding path that another engineer could understand and repeat.
    \textbf{Action:} I standardized the movement from staging to core to BI, localized
    source-specific logic behind a common contract, and made identity fields, provenance,
    tests, runbooks, and versioned database changes part of the adapter pattern. I wrote
    the pattern from the perspective of the next engineer: where a new source should vary,
    what must remain invariant, and what evidence was required before release.
    \textbf{Result:} Future onboarding became an exercise in implementing a known contract
    rather than redesigning the warehouse, reducing both delivery risk and dependence on
    the original authors.
- id: hhax-11
  text_tex: Diagnosed and remediated a multi-payer EVV dashboard data-loss defect
    by tracing fact-to-dimension joins across 1.12 billion visit records; quantified
    214.5 million records (19.2\%) excluded by missing patient, service-code, and
    payer mappings, isolated 99.2\% of in-scope missing-patient visits to the CareSource
    feed, and corrected the underlying integration defects.
  story_tex: >-
    \textbf{Situation:} A multi-payer EVV dashboard was visibly undercounting visits, and
    the first suspicion was a reporting filter. Changing the dashboard would have hidden
    the symptom without proving whether the warehouse had already discarded the records.
    \textbf{Task:} I needed to find exactly where the population disappeared and determine
    whether the problem was broad or concentrated in one integration. \textbf{Action:} I
    treated the join path as a funnel, measuring which visits survived each patient,
    service-code, and payer relationship. That showed roughly one in five visits falling
    out before the dashboard ever saw them. I then narrowed the missing-patient cohort by
    payer and source and found that it was overwhelmingly concentrated in the CareSource
    feed. I traced representative records back to the faulty mappings and corrected the
    patient, service-code, and payer integration logic. \textbf{Result:} We fixed the data
    loss at its source rather than disguising it in the dashboard, restored confidence in
    the multi-payer view, and gained a reusable method for investigating future join loss.
- id: hhax-12
  text_tex: Executed structural, row-level, transformation, and completeness QA for
    a 156-field Snowflake/dbt EVV visit model; uncovered and corrected defects associated
    with a 52.23\% source-to-target row-count gap, 73.6\% null patient identifiers,
    and 105.6 million orphaned visit relationships.
  story_tex: >-
    \textbf{Situation:} A new Sandata visit model completed successfully and looked
    structurally plausible, but downstream analytics would depend on every visit retaining
    its patient and business context. A green dbt run was not evidence that the population
    had survived. \textbf{Task:} I needed to prove the model's grain, transformations, and
    completeness before anyone built reporting on top of it. \textbf{Action:} I worked
    from the outside in: verified the schema and field behavior, tested visit identity,
    reconciled the source population, and then followed relationships into the patient
    model. The turning point came when the reconciliation showed that more than half of
    the expected visits were missing and that null patient identities and orphaned
    relationships were systemic, not edge cases. I traced the losses through the join and
    mapping logic, corrected the responsible transformations, and reran the same acceptance
    sequence. \textbf{Result:} The team avoided publishing a model that looked complete
    but was analytically unsafe, and the repaired visit layer moved forward with a
    reproducible body of evidence behind it.
- id: hhax-13
  text_tex: Validated and remediated an EVV patient-address model, resolving six
    documented defects involving deletion handling, multi-address coverage, usage-tag
    logic, and production data types; verified 1.31 million unique keys, zero missing
    parent references, and exact 158,084-row parity for the deduplicated parent-matched
    population.
  story_tex: >-
    \textbf{Situation:} The first patient-address model appeared workable for a single
    address, but real patients could have multiple addresses with different purposes and
    lifecycle states. The model also failed in production when an upstream type changed,
    revealing that both its business logic and operational resilience needed attention.
    \textbf{Task:} I needed to redesign the model around the patient relationship, correct
    the address semantics, and prove that the production fix did not introduce new data
    loss. \textbf{Action:} I documented each failure mode, reused the governed patient
    entity, incorporated the appropriate supplemental address sources, added deletion and
    usage semantics, aligned the key pattern with the established HHA model, and delivered
    a focused type-handling hotfix. I then validated uniqueness, parent linkage, required
    fields, join coverage, filters, and source-to-target reconciliation as one acceptance
    path. \textbf{Result:} The model supported real multi-address behavior, every retained
    address resolved to a patient, the reconciled population matched its source exactly,
    and the production issue was closed without sacrificing analytical correctness.

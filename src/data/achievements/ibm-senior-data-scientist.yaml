# Provisional STAR reconstructions: implementation details, examples, ownership,
# and outcomes must be verified against the user's recollection and source records.
- id: ibm-senior-data-scientist-01
  text_tex: Served as a lead member of Provider Analytics, integrating disparate and
    centralized sources into data marts and supporting data mining, statistical-model
    development, and advanced analytics.
  story_tex: >-
    \textbf{Situation:} Provider Analytics depended on clinical, claims, and operational
    sources that used different identifiers, grains, and refresh schedules. \textbf{Task:}
    As a lead member, I needed to create dependable data marts for analysts and modelers.
    \textbf{Action:} I clarified analytical grains, mapped source identities to conformed
    entities, standardized measures and time windows, built reconciliation checks, and
    worked with analysts to validate that the marts supported mining and statistical-model
    use cases. \textbf{Result:} The team gained reusable, traceable datasets instead of
    rebuilding source logic for each analysis, shortening the path from question to result.
- id: ibm-senior-data-scientist-02
  text_tex: Worked with senior leaders and colleagues to identify opportunities, define
    objectives, and formulate analytics strategies that produced measurable impact.
  story_tex: >-
    \textbf{Situation:} Senior leaders had multiple promising analytics ideas, but their
    value, feasibility, and measures of success were not always explicit. \textbf{Task:}
    I needed to turn broad opportunities into executable analytical work. \textbf{Action:}
    I facilitated discovery conversations, translated business concerns into testable
    questions, identified available data and constraints, defined outcome measures and
    decision points, and proposed phased strategies. \textbf{Result:} Stakeholders could
    compare opportunities on a common basis, and the team focused on analyses with clear
    objectives, owners, and a credible path to measurable impact.
- id: ibm-senior-data-scientist-03
  text_tex: Served as technical lead across electronic health records, insurance claims,
    scheduling and financial data, social determinants of health, and other relevant
    sources.
  story_tex: >-
    \textbf{Situation:} Provider analytics questions increasingly crossed EHR, claims,
    scheduling, finance, and social-determinants data, none of which shared a simple common
    model. \textbf{Task:} I needed to lead the integration while preserving each source's
    meaning and limitations. \textbf{Action:} I defined contracts and analytical grains,
    established identity and time-window rules, documented lineage and caveats,
    coordinated implementation across owners, and required cross-source reconciliation.
    \textbf{Result:} Analysts received an integrated view they could use without hiding
    material differences in coverage, timing, or provenance.
- id: ibm-senior-data-scientist-04
  text_tex: Developed migration-validation analysis spanning more than 150 billion
    deidentified health records, reconciling source and target schemas, partitions,
    values, aggregates, and business rules during the transition from legacy HDFS
    infrastructure to Azure.
  story_tex: >-
    \textbf{Situation:} Moving more than 150 billion deidentified health records from
    HDFS to Azure risked changing content or business behavior despite successful loads.
    \textbf{Task:} I needed migration evidence at a scale where manual sampling was
    inadequate. \textbf{Action:} I automated source-to-target comparisons for schemas,
    partitions, counts, field values, aggregates, and business rules; isolated differences
    by dataset and stage; and tracked unexplained variances through correction and rerun.
    \textbf{Result:} The team could distinguish expected platform differences from defects
    and make acceptance decisions using repeatable, documented evidence.
- id: ibm-senior-data-scientist-05
  text_tex: Provided production and configuration support for Phytel population-health
    applications, troubleshooting data and operational issues affecting provider configuration,
    care-gap identification, patient outreach, and quality-reporting workflows.
  story_tex: >-
    \textbf{Situation:} Phytel issues could appear as missing care gaps, incorrect provider
    populations, failed outreach, or reporting discrepancies even when the root cause was
    configuration or data. \textbf{Task:} I needed to restore workflows and identify the
    right lasting fix. \textbf{Action:} I traced examples from provider configuration
    through patient and measure data, compared expected and actual states, reviewed recent
    changes, and coordinated corrections across support and engineering. \textbf{Result:}
    Operational issues were resolved with a documented cause, and recurring defects could
    be prevented through targeted configuration or data changes.
- id: ibm-senior-data-scientist-06
  text_tex: Supported data and integration work for Pennsylvania's statewide P3N health-information
    exchange, encompassing master patient identity, provider directories, clinical-document
    discovery, patient consent, and real-time ADT encounter notifications.
  story_tex: >-
    \textbf{Situation:} Pennsylvania's P3N exchange had to connect patient identity,
    provider directories, consent, document discovery, and real-time ADT notifications
    across organizations. \textbf{Task:} I needed to support the connected workflow rather
    than treat each function as an isolated feed. \textbf{Action:} I mapped identifiers
    and message flows, validated representative patient and provider matches, checked
    consent and document-discovery behavior, traced ADT events end to end, and documented
    exceptions. \textbf{Result:} The exchange gained clearer evidence that workflows
    preserved identity, authorization, and event continuity across boundaries.
- id: ibm-senior-data-scientist-07
  text_tex: Supported the controlled decommissioning of legacy Explorys capabilities
    by analyzing downstream dependencies and validating continuity across normalized
    clinical, claims, laboratory, billing, and operational datasets.
  story_tex: >-
    \textbf{Situation:} Retiring legacy Explorys capabilities risked breaking hidden
    dependencies across clinical, claims, laboratory, billing, and operational workflows.
    \textbf{Task:} I needed to identify what could be retired safely and what required a
    replacement path. \textbf{Action:} I inventoried consumers, traced lineage to legacy
    datasets, grouped dependencies by criticality, compared replacement outputs to current
    behavior, and supported staged validation before shutdown. \textbf{Result:} The program
    could decommission capabilities in a controlled sequence and expose unresolved
    dependencies before access disappeared.
- id: ibm-senior-data-scientist-08
  text_tex: Supported Cleveland Clinic Foundation's accelerated SuperMart migration
    from MySQL to Greenplum by assessing dashboard dependencies and defining the changes
    required to preserve reporting continuity.
  story_tex: >-
    \textbf{Situation:} Cleveland Clinic Foundation needed to accelerate a SuperMart
    migration from MySQL to Greenplum while dashboards depended on database-specific
    tables and SQL behavior. \textbf{Task:} I needed to define the compatibility work
    required to preserve reporting. \textbf{Action:} I inventoried dashboard queries and
    source objects, identified differences in types, functions, joins, and performance,
    mapped dependencies to target changes, and prioritized validation by criticality.
    \textbf{Result:} The team received an actionable conversion plan and avoided finding
    essential dashboard dependencies only after cutover.
- id: ibm-senior-data-scientist-09
  text_tex: Created and delivered Phytel configuration training covering provider
    activation, system changes, support procedures, and the clinical-data workflows
    underlying proactive population-health management.
  story_tex: >-
    \textbf{Situation:} Phytel administrators needed to understand how configuration
    changes affected care-gap, outreach, and population-health workflows. \textbf{Task:}
    I needed to teach both the procedure and its downstream data consequences.
    \textbf{Action:} I built scenario-based training, demonstrated activation and change
    procedures, traced examples into clinical workflows, covered common failure paths,
    and used exercises to confirm understanding. \textbf{Result:} Learners could perform
    routine configuration more confidently and recognize when an issue required data,
    application, or engineering support.
- id: ibm-senior-data-scientist-10
  text_tex: Performed postmigration validation for an enterprise Jira transition,
    reconciling projects, issues, workflows, custom fields, permissions, histories,
    and relationships and documenting discrepancies for remediation before cutover.
  story_tex: >-
    \textbf{Situation:} A Jira migration could appear complete while losing workflow
    states, fields, permissions, history, or links that teams relied on. \textbf{Task:}
    I needed to validate functional equivalence before cutover. \textbf{Action:} I built
    source-to-target inventories and counts for projects, issues, workflows, fields,
    permissions, histories, and relationships; tested complex cases; categorized findings
    by severity; and documented reproducible defects for remediation and retest.
    \textbf{Result:} The team had acceptance evidence and a clear defect list, reducing
    the risk of missing access or broken work history after migration.
- id: ibm-senior-data-scientist-11
  text_tex: Developed and delivered peer-led Azure instruction through the REACH initiative,
    translating cloud architecture, storage, data integration, security, and analytics
    concepts into practical guidance for technical colleagues.
  story_tex: >-
    \textbf{Situation:} Colleagues familiar with the legacy platform needed a practical
    way to understand Azure, not a catalog of services. \textbf{Task:} Through REACH, I
    needed to connect cloud concepts to work they already performed. \textbf{Action:} I
    designed instruction around architecture, storage, integration, security, and
    analytics, mapped legacy patterns to Azure equivalents, used migration exercises, and
    revised material from participant questions. \textbf{Result:} Colleagues gained a
    working mental model for evaluating Azure designs and could participate more
    effectively in migration discussions.
- id: ibm-senior-data-scientist-12
  text_tex: Led delivery of a tailored analytics and reporting project using client
    administrative data.
  story_tex: >-
    \textbf{Situation:} A client had administrative data but lacked reporting tied to the
    operational decisions it needed to make. \textbf{Task:} I needed to lead a tailored
    delivery without imposing a generic dashboard. \textbf{Action:} I clarified the
    decisions and audience, profiled the fields, defined the reporting grain and measures,
    built a validated analytical dataset, and iterated on reports using examples and
    reconciliation totals. \textbf{Result:} The client received reporting aligned to its
    workflow, with documented metrics and a traceable path back to source data.
- id: ibm-senior-data-scientist-13
  text_tex: Engineered a Spark, Hive, and Impala analytics framework powering 50+
    prior-authorization lag-time and approval-bottleneck reports with daily operational
    and periodic regulatory and financial snapshots.
  story_tex: >-
    \textbf{Situation:} Prior-authorization teams lacked a consistent view of where
    requests waited and which stages created bottlenecks. \textbf{Task:} I needed to turn
    large workflow histories into reusable timing measures. \textbf{Action:} I built a
    Spark, Hive, and Impala framework that normalized status events, calculated stage and
    end-to-end lag, preserved historical snapshots, and exposed shared dimensions and
    measures to more than 50 reports. \textbf{Result:} Operations received daily
    bottleneck visibility while regulatory and financial users received consistent
    periodic snapshots from the same governed logic.

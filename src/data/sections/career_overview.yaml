- id: overview
  kind: raw
  tex: 'Interdisciplinary data engineer, analyst, software developer, and educator
    with a foundation in physics and fine arts and more than a decade of experience
    building reliable data systems in healthcare, insurance, and color science. Leads
    ambiguous, high-stakes work from source discovery and requirements through modeling,
    automation, validation, migration, documentation, and production handoff, spanning
    cloud data platforms, more than 100 billion clinical records, multi-organization
    EHR integrations, revenue-cycle models, and applied machine learning. Known for
    turning complex technical and scientific problems into reproducible systems, clear
    explanations, and measurable delivery improvements.

'
- id: overview-2
  kind: raw
  tex: |2

    Career experience also includes college physics and astronomy teaching, published astrophysics and printmaking research, independent product development and consulting, visual arts, community service, organizational leadership, and hands-on farm and operations work. Across these settings, combines analytical rigor, creative problem solving, practical craftsmanship, continuous learning, and a commitment to making knowledge, tools, and opportunities more accessible to others.

  % Comprehensive inventory for the master history, not a ready-made targeted resume.
  % Promotion policy for targeted resumes:
  % - Current/Core: recent or recurring applied work; safe to foreground when relevant.
  % - Working Knowledge: applied experience, but verify depth and recency for a target role.
  % - Historical: earlier applied work; do not promote without explicit role relevance.
  % User-confirmed recollections are included, but do not by themselves establish recency.
  % Person in Charge certification date and current validity are not recorded.
blocks:
- id: programming-and-query-languages
  kind: raw
  tex: "\\textbf{Programming and Query Languages:} \\textit{Current/Core:} SQL, Python,
    Ruby, Bash/Zsh, SQL/Jinja; \\textit{Working Knowledge:} JavaScript, C\\#, Swift,
    Java, R, T-SQL, PL/SQL; \\textit{Historical:} VB.NET, C++, FORTRAN, Perl, IDL,
    MQL, XPath, XQuery, JSONPath, Jaql\\\\\n"
- id: application-development
  kind: raw
  tex: "\\textbf{Application Development:} \\textit{Working Knowledge:} APIs and web
    services, JSON and schema validation, document extraction and OCR-to-LLM parsing,
    native macOS development, SwiftUI, application permissions and accessibility configuration,
    scripted packaging, Spring Boot/Jersey; \\textit{Historical:} ASP.NET, MVC, Web
    APIs, React, Node.js, HTML5, CSS, LINQ, commercial-insurance rating applications\\\\\n"
- id: databases-and-query-engines
  kind: raw
  tex: "\\textbf{Databases and Query Engines:} \\textit{Current/Core:} Snowflake,
    PostgreSQL; \\textit{Working Knowledge:} Amazon Athena, Amazon Redshift, Azure
    Synapse Analytics, Microsoft SQL Server, MySQL, MongoDB/PyMongo, SQL query tuning
    and indexing, partitioning and clustering; \\textit{Historical:} Oracle, Hive,
    Impala, Greenplum\\\\\n"
- id: data-architecture-and-engineering
  kind: raw
  tex: "\\textbf{Data Architecture and Engineering:} \\textit{Current/Core:} dbt,
    SQLMesh, Snowpark, ETL/ELT, data integration and transformation, data warehouses
    and lakes, source-system discovery and feasibility analysis, source-to-target
    mapping, dimensional modeling, business-grain definition, natural/composite/surrogate
    keys, identity crosswalks, metadata-driven transformations, data contracts and
    lineage; \\textit{Working Knowledge:} Spark, Kafka, Data Vault modeling, Parquet,
    OMOP Common Data Model; \\textit{Historical:} Hadoop/HDFS, Pig\\\\\n"
- id: data-quality-governance-and-migration
  kind: raw
  tex: "\\textbf{Data Quality, Governance, and Migration:} \\textit{Current/Core:}
    data-quality strategy and automated testing, acceptance criteria, null/duplicate/referential-integrity
    and business-rule checks, source-to-target and aggregate reconciliation, schema-drift
    detection, parity checks, regression testing, UAT, migration-acceptance testing,
    deidentification validation, idempotent and deterministic reruns, audit logging;
    \\textit{Working Knowledge:} role-based access control (RBAC) design, terminology
    mapping, data-sharing and consent constraints\\\\\n"
- id: data-operations-and-reliability
  kind: raw
  tex: "\\textbf{Data Operations and Reliability:} \\textit{Current/Core:} job scheduling,
    workflow orchestration, pipeline and software dependency management, observability,
    monitoring and alerting, incident classification and response, production troubleshooting,
    runbooks, release and promotion gates, configuration and version management\\\\\n"
- id: cloud-devops-and-test-tools
  kind: raw
  tex: "\\textbf{Cloud, DevOps, and Test Tools:} \\textit{Current/Core:} AWS (S3,
    Glue, Lambda, CloudWatch, AWS CLI), Microsoft Azure (Data Factory, Functions,
    Blob Storage), Git/GitHub, GitHub Actions, Docker, CI/CD, automated unit and integration
    testing, test fixtures and golden files, RSpec, RuboCop, Liquibase, Make, CLI
    environment setup, Python virtual environments; \\textit{Working Knowledge:} hermetic
    tests, Azure DevOps, Jenkins, Helm/Kubernetes, Gradle, Postman, regular expressions,
    Tesseract OCR, RubyLLM; \\textit{Historical:} cron\\\\\n"
- id: healthcare-data-and-interoperability
  kind: raw
  tex: "\\textbf{Healthcare Data and Interoperability:} \\textit{Current/Core:} clinical,
    payer, eligibility, claims, revenue-cycle, and financial data; EHR/EMR integration;
    HL7 v2/v3, FHIR, EDI/837; patient/provider identity, population health, care gaps,
    HEDIS and other quality measures and registries, prior authorization, health-information
    exchange, ADT notifications, PHI handling and HIPAA-compliant deidentification
    workflows; \\textit{Working Knowledge:} social determinants of health, provider
    directories, patient consent, HITRUST readiness support\\par\\newpage\n"
- id: analytics-machine-learning-and-bi
  kind: raw
  tex: "\\textbf{Analytics, Machine Learning, and BI:} \\textit{Current/Core:} data
    analysis, statistics, machine learning, predictive modeling, pandas, Jupyter,
    Power BI, data visualization, dashboard and report design, BI visual standards,
    operational and executive reporting; \\textit{Working Knowledge:} model monitoring,
    Tableau, R/Shiny, time-series forecasting and ARIMA diagnostics, optimization,
    NLP and topic modeling, XGBoost, random forests, neural networks, classification
    and regression evaluation (confusion matrices, ROC/AUC, calibration); \\textit{Historical:}
    SAS/GRAPH\\\\\n"
- id: scientific-research-and-computing
  kind: raw
  tex: "\\textbf{Scientific Research and Computing:} \\textit{Working Knowledge:}
    experimental design, measurement uncertainty, instrument calibration, numerical
    analysis, linear algebra, mathematical modeling and simulation, finite-difference
    methods, interpolation, numerical integration and differentiation, error and stability
    analysis; \\textit{Historical:} physics and astrophysics research, telescope observing
    plans and logs, laboratory equipment maintenance, infrared spectroscopy and photometry,
    astrometry and source cross-matching, stellar classification and isochrone comparison,
    optical measurement and spectrophotometry, color matching and formulation, radiative-transfer
    modeling, statistical risk analysis, Fourier analysis, Monte Carlo methods, IRAF,
    SpeXtool, DAOPHOT, PASCO DataStudio, Mathematica, MATLAB, LabVIEW, Maple, PDL,
    JMP\\\\\n"
- id: teaching-and-learning
  kind: raw
  tex: "\\textbf{Teaching and Learning:} \\textit{Current/Core:} technical writing,
    documentation, stakeholder communication, mentoring, public speaking and training;
    \\textit{Working Knowledge:} curriculum and instructional design, recorded/online
    instruction, rubric design, learning-management systems, accommodations and accessibility
    practices (presentation, response, timing, and setting), formal evaluation of
    learning outcomes, research publication; \\textit{Historical:} physics and astronomy
    instruction, laboratory instruction, tutoring and test preparation, peer instruction,
    Just-in-Time Teaching, Interactive Lecture Demonstrations, student feedback-based
    instructional improvement, order-of-magnitude estimation and comparative-risk
    communication\\\\\n"
- id: consulting-leadership-and-business
  kind: raw
  tex: "\\textbf{Consulting, Leadership, and Business:} \\textit{Current/Core:} requirements
    facilitation, client discovery, stakeholder alignment, cross-functional delivery,
    technical specifications, code review, team mentoring and onboarding, proposal
    writing, pricing, invoicing, contract negotiation, bookkeeping, accounting, tax
    compliance, marketing, client acquisition, promotional-material development; \\textit{Working
    Knowledge:} product prototyping, cost and throughput tracking, change management,
    intellectual-property portfolio support\\\\\n"
- id: customer-service-sales-and-administration
  kind: raw
  tex: "\\textbf{Customer Service, Sales, and Administration:} \\textit{Working Knowledge:}
    customer relationship management (CRM), conflict de-escalation, copyediting to
    a style guide; \\textit{Historical:} consultative selling, telephone outreach,
    point-of-sale transactions, cash reconciliation, returns processing, merchandising,
    inventory counts, library reference service and collection inventory, Library
    of Congress classification, editorial writing and community journalism, club administration
    and event planning\\\\\n"
- id: community-and-civic-service
  kind: raw
  tex: "\\textbf{Community and Civic Service:} \\textit{Working Knowledge:} volunteer
    scheduling, community-health data preparation; \\textit{Historical:} public-record
    data transformation, community meal distribution and guest service, youth mentoring
    and outreach\\\\\n"
- id: creative-and-visual-arts
  kind: raw
  tex: "\\textbf{Creative and Visual Arts:} \\textit{Historical:} relief, intaglio,
    screen, and monoprint processes; plate and screen preparation, proofing, editioning
    and print exchanges; painting, drawing, photography and papermaking; exhibition
    preparation, commissioned work, studio collaboration, process experimentation
    and safer-material substitution; Adobe Illustrator, Adobe Photoshop, GIMP, AutoCAD\\\\\n"
- id: farm-property-logistics-and-industrial-operations
  kind: raw
  tex: "\\textbf{Farm, Property, Logistics, and Industrial Operations:} \\textit{Current/Core:}
    orchard establishment, pruning, irrigation, pest monitoring, harvest planning,
    seasonal tree care, grounds maintenance, supplies and equipment management; \\textit{Historical:}
    estimating and quoting maintenance jobs, surface preparation and painting, concrete
    repair, ladders and power tools, construction cleanup, warehouse picking/packing
    and loading, production-line preparation and shop-floor safety, scrap sorting,
    event setup/teardown, waste and recycling handling\\\\\n"
- id: food-service-and-hospitality
  kind: raw
  tex: "\\textbf{Food Service and Hospitality:} \\textit{Historical:} food preparation,
    meal-service coordination, coffee and espresso preparation, counter service, dish-room
    and work-area sanitation, stocking, opening and closing duties, Person in Charge
    (PIC) certification\\\\\n"
- id: general-tools
  kind: raw
  tex: "\\textbf{General Tools:} \\textit{Current/Core:} Microsoft Office, LaTeX;
    \\textit{Working Knowledge:} Jira, Confluence, Salesforce CRM\n"

- id: research-assistant-department-of-physics
  kind: subrole
  leading_tex: ''
  title_tex: Research Assistant, Department of Physics
  dates_tex: Sep. 2006 - Sep. 2010
  before_items_tex: |2

    Conducted near-infrared astronomical research using observations from the 0.8--5.4 micrometer SpeX spectrograph at the NASA Infrared Telescope Facility.
  item_open_tex: "\\begin{itemize}\n"
  items:
  - id: research-assistant-department-of-physics-01
    prefix_tex: "  \\item "
    text_tex: Reduced and analyzed $0.8$--$2.4$ micrometer, $R \sim 2000$ SpeX spectra
      and measured diagnostic H~I, He~I, He~II, C~IV, N~III, and CO spectral features
      across nine candidate cluster members.
    ending_tex: "\n"
  - id: research-assistant-department-of-physics-02
    prefix_tex: "  \\item "
    text_tex: Co-developed an astrometrically calibrated catalog of 130 sources by
      registering SpeX acquisition images to 2MASS; compiled available $JHK$ photometry
      and used DAOPHOT to separate blended sources in the crowded field.
    ending_tex: "\n"
  - id: research-assistant-department-of-physics-03
    prefix_tex: "  \\item "
    text_tex: Helped classify the cluster's massive stellar population, identifying
      an O5~V dwarf, several early-B stars, and a massive young stellar object exhibiting
      CO band-head emission from dense circumstellar material.
    ending_tex: "\n"
  - id: research-assistant-department-of-physics-04
    prefix_tex: "  \\item "
    text_tex: Combined spectral classifications with 2MASS photometry to estimate
      cluster extinction ($A_V \sim 21$--$23$), distance ($1.0$--$1.75$ kpc), age
      of no more than a few million years, and mass of approximately $10^3$ solar
      masses.
    ending_tex: "\n"
  - id: research-assistant-department-of-physics-05
    prefix_tex: "  \\item "
    text_tex: Cross-matched infrared and radio-source positions and identified candidate
      near-infrared counterparts for three deeply embedded radio sources associated
      with early star formation.
    ending_tex: "\n"
  - id: research-assistant-department-of-physics-06
    prefix_tex: "  \\item "
    text_tex: Published the resulting 130-source astrometric and photometric catalog
      through the international VizieR astronomical data service.
    ending_tex: "\n"
  - id: research-assistant-department-of-physics-07
    prefix_tex: "  \\item "
    text_tex: Acquired follow-up L-band spectra of Galactic OB stars with SpeX during
      three consecutive nights at NASA's IRTF.
    ending_tex: "\n"
  - id: research-assistant-department-of-physics-08
    prefix_tex: "  \\item "
    text_tex: Estimated stellar radial velocities by measuring pixel-space shifts
      of CO absorption features against normalized standard-star spectra.
    ending_tex: "\n"
  - id: research-assistant-department-of-physics-09
    prefix_tex: "  \\item "
    text_tex: Performed astronomical spectroscopy, photometry, classification, calibration,
      signal analysis, and noise reduction using IRAF, IDL, SpeXtool, Mathematica,
      and Perl.
    ending_tex: "\n"
  item_close_tex: "\\end{itemize}\n"
  after_items_tex: ''
